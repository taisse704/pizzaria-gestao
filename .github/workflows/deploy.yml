name: Publicar Pizzaria Gestão - Vendas e Financeiro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-pizzaria-gestao
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Compilar Vendas (endereço atual preservado)
        run: npm run build -- --outDir dist-vendas
        env:
          VITE_APP_MODE: vendas
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Compilar Financeiro (área separada)
        run: npm run build -- --outDir dist-financeiro --base=/pizzaria-gestao/financeiro/
        env:
          VITE_APP_MODE: financeiro
          VITE_FINANCEIRO_SUPABASE_URL: https://mstohdtaeyqbiwwahuti.supabase.co
          VITE_FINANCEIRO_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-WLMX4jL5OXMs9lPW9jmBA_xFMYGFaL
      - name: Montar publicação sem substituir Vendas
        run: |
          mkdir -p dist
          cp -a dist-vendas/. dist/
          mkdir -p dist/financeiro
          cp -a dist-financeiro/. dist/financeiro/
      - name: Preparar artefato GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
